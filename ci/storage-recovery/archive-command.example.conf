# 仅为管理员审阅模板，不由工具自动写入/加载/重启PG。
# 源侧须安装固定Node24及受控Harbor脚本，PG UID读取root所有0644的archive profile；key为PG专用UID的0600。
# 先由root准备真实cluster身份绑定元数据，再由管理员通过既有维护流程配置归档。
# UID、路径、工具链、管理员连接及完整DB/role范围均须按实际环境核对；不得指向共享未授权cluster。
archive_mode = on
archive_timeout = 60
archive_command = '/usr/local/lib/harbor/node/bin/node /usr/local/lib/harbor/storage-backup.mjs archive-wal %f'
# 本地加密WAL归档并不等同于offhost副本或已达15分钟RPO；须实际验证连续性、完整恢复点与异机恢复。
