<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Harbor · 本地 AI 网关</title><link rel="stylesheet" href="/style.css"></head>

<div id="login" class="login-wrap hidden"><form id="login-form" class="login-card"><div class="brand-mark">H</div><h1>Harbor 管理后台</h1><label>管理密码<input id="admin-input" name="password" type="password" autocomplete="current-password" required placeholder="输入管理密码"></label><button class="primary">进入管理后台</button><p class="hint">初始密码见运行文件夹中的「管理密码.txt」。</p><button type="button" id="employee-entry" class="text-button">使用员工 Key 测试 →</button></form></div>

 <aside><div class="brand"><span class="brand-mark">H</span><div>Harbor<small>LOCAL AI GATEWAY</small></div></div><div class="nav-caption">工作空间</div><nav>
 <button data-tab="overview" class="nav active"><span>◫</span>运行总览</button><button data-tab="members" class="nav"><span>♧</span>员工与密钥</button><button data-tab="accounts" class="nav"><span>▦</span>上游账号池</button><button data-tab="usage" class="nav"><span>≡</span>使用数据</button><button data-tab="system" class="nav"><span>⌘</span>系统管理</button>

 <main><div class="page"><div id="content"></div></div><footer>HARBOR / AI 工作空间</footer></main>
