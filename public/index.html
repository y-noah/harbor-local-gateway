<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Harbor · 本地 AI 网关</title><link rel="stylesheet" href="/style.css"></head>
<body>
<div id="login" class="login-wrap hidden"><form id="login-form" class="login-card"><div class="brand-mark">H</div><h1>欢迎来到 Harbor</h1><p class="muted">你的本地 AI 工作台</p><label>管理密码<input id="admin-input" name="password" type="password" autocomplete="current-password" required placeholder="输入管理密码，无需账号"></label><button class="primary">进入管理后台</button><p class="hint">初始密码见运行文件夹中的「管理密码.txt」。<br>员工使用 API Key，可直接进入请求测试。</p><button type="button" id="employee-entry" class="text-button">使用员工 Key 测试 →</button></form></div>
<div id="shell" class="shell hidden">
 <aside><div class="brand"><span class="brand-mark">H</span><div>Harbor<small>LOCAL AI GATEWAY</small></div></div><div class="nav-caption">工作空间</div><nav>
 <button data-tab="overview" class="nav active"><span>◫</span>运行总览</button><button data-tab="members" class="nav"><span>♧</span>员工与密钥</button><button data-tab="accounts" class="nav"><span>▦</span>上游账号池</button><button data-tab="sessions" class="nav"><span>↳</span>会话绑定</button><button data-tab="requests" class="nav"><span>≡</span>使用记录</button><button data-tab="history" class="nav" aria-label="系统操作历史" title="系统操作历史"><span>◷</span>系统操作历史</button><button data-tab="playground" class="nav"><span>⌘</span>接入与测试</button>
 </nav><div class="aside-bottom"><div class="sidebar-status"><span id="connection" class="pill" aria-live="polite">正在连接</span><button id="refresh" class="icon-button" title="刷新当前页面" aria-label="刷新当前页面">↻</button></div><div id="admin-tools" class="sidebar-tools hidden"></div><button id="logout" class="text-button" aria-label="退出后台" title="退出后台">退出后台</button></div></aside>
 <main><div class="page"><div id="content"></div></div><footer>HARBOR / AI 工作空间</footer></main>
</div>
<dialog id="modal"><div class="modal-toolbar"><button type="button" class="modal-close" data-action="close" aria-label="关闭弹窗" title="关闭弹窗" autofocus>×</button></div><div id="modal-content"></div></dialog><div id="toast" class="toast hidden" role="status"></div><script type="module" src="/app.js"></script>
</body></html>
